[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bids-sql"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "universal_pathlib>=0.2.0",
    "fsspec",
    "s3fs",
    "nibabel",
    "pandas",
    "numpy",
    "sentence-transformers",
    "pybids",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest>=8"]

# Expose top-level modules AND the db sub-package.
# With `pip install -e .` the BIDS-SQL/ dir is added to sys.path, so all
# bare imports (from db.db import ..., from input_pipeline import ..., etc.)
# continue to work unchanged.
[tool.setuptools]
py-modules = ["input_pipeline", "rules", "settings", "utils", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
