services:

  # ── PostgreSQL metadata store ────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: bids_sql_postgres
    environment:
      POSTGRES_DB:       ${METADATA_DB_NAME}
      POSTGRES_USER:     ${METADATA_DB_USER}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD}
    volumes:
      - postgres-bids-data:/var/lib/postgresql/data
    ports:
      - '${METADATA_DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${METADATA_DB_USER} -d ${METADATA_DB_NAME} -p 5432']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bids-sql-network

  # ── BIDS-SQL CLI ─────────────────────────────────────────────────────────────
  # Usage:
  #   docker compose run --rm bids-sql /data              # index + validate
  #   docker compose run --rm bids-sql /data --no-validate # index only (fast)
  #   docker compose run --rm bids-sql --rules             # print discovery rules
  bids-sql:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bids_sql_cli
    env_file: .env
    environment:
      # Override host + port for internal container-to-container traffic.
      # Postgres always listens on 5432 inside Docker regardless of the
      # host-side exposed port (5429 in .env — that stays unchanged).
      METADATA_DB_HOST: postgres
      METADATA_DB_PORT: 5432
      # Tell the pipeline where to find the validator sidecar
      BIDS_VALIDATOR_URL: http://bids-validator:8080
    volumes:
      - ${BIDS_DATA_PATH:-./data}:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bids-sql-network

  # ── BIDS Validator sidecar ────────────────────────────────────────────────────
  # Official image — no npm install needed, pulls a pre-built binary.
  # The CLI calls `bids-validator /data --json` inside this container via
  # `docker compose run --rm bids-validator /data` when validation is requested.
  # Keeping it as a separate service means the bids-sql image stays fast to build
  # and the validator can be updated independently.
  bids-validator:
    image: bids/validator
    container_name: bids_sql_validator
    volumes:
      - ${BIDS_DATA_PATH:-./data}:/data:ro
    networks:
      - bids-sql-network
    # No ports, no restart — invoked on demand via `docker compose run`

networks:
  bids-sql-network:
    driver: bridge

volumes:
  postgres-bids-data:
